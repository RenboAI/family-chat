name: keep-alive

on:
  schedule:
    -     - cron: '20 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase keep alive
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          base="${URL%/}"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body.txt -w '%{http_code}' \
              -X PATCH \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              --max-time 30 \
              -d "{\"beat_at\":\"$now\"}" \
              "$base/rest/v1/heartbeat?id=eq.1")
            echo "attempt $i - code: $code"
            if [ "$code" = "204" ] || [ "$code" = "200" ]; then
              echo "OK - wrote to database"
              exit 0
            fi
            cat /tmp/body.txt
            [ $i -lt 3 ] && sleep 20
          done
          exit 1
